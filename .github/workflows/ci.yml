# Continuous integration for RiftLab.
#
# Runs on every pull request and on main. The job name below - `tests` - is the
# required status check listed in .github/rulesets/main.json, so renaming it
# means editing that file too, or merges block forever on a check that never
# reports. tests/test_repo.py compares the two and fails first.
#
# The job runs on every pull request without a paths filter, on purpose: a
# required check that is skipped because a path did not match leaves the pull
# request waiting for a report that never comes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Pinned to the patch version, not "3.12": a floating interpreter
          # means the same tag rebuilt in three months behaves differently, and
          # an analysis tool for a study has to stay reproducible. Raise this
          # deliberately, as its own change.
          python-version: "3.12.10"
          cache: pip

      # The full set, not a minimal one: this is what somebody who follows the
      # README ends up with, so it is what should be tested.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run the test suite
        env:
          PYTHONPATH: .
        run: python -m pytest tests/ -q
