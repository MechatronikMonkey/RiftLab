# Continuous integration for RiftLab.
#
# Runs on every pull request and on main. The two job names below - `tests` and
# `installer` - are the required status checks listed in
# .github/rulesets/main.json, so renaming a job means editing that file too, or
# merges block forever on a check that never reports. tests/test_repo.py
# compares the two and fails first.
#
# Both jobs run on every pull request without a paths filter, on purpose: a
# required check that is skipped because a path did not match leaves the pull
# request waiting for a report that never comes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # The interpreter is pinned in .python-version - one file, read by
          # setup-python here and by packaging/build.ps1 locally. A floating
          # "3.12" would mean the same tag rebuilt in three months produces a
          # different binary, and an analysis tool for a study has to stay
          # reproducible. Raise it deliberately, as its own change.
          python-version-file: .python-version
          cache: pip

      # The full set, not a minimal one: this is what somebody who follows the
      # README ends up with, so it is what should be tested.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run the test suite
        env:
          PYTHONPATH: .
        run: python -m pytest tests/ -q

  installer:
    name: installer
    runs-on: windows-latest
    needs: tests

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $m = Select-String -Path riftlab/__init__.py -Pattern '^__version__\s*=\s*"([^"]+)"'
          "version=$($m.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - uses: ./.github/actions/build-installer
        with:
          version: ${{ steps.version.outputs.version }}

      # Not a release - a downloadable build of this branch, so a packaging
      # change can be tried on a real machine before it is merged.
      - uses: actions/upload-artifact@v7
        with:
          name: RiftLab-Setup-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: dist/RiftLab-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
