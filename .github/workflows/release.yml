# Cut a RiftLab release.
#
# Trigger: a `v*` tag on main.
#
#     git switch main && git pull
#     git tag v0.2.0
#     git push origin v0.2.0
#
# The version is bumped beforehand, in riftlab/__init__.py, through a normal
# pull request. This workflow refuses to build if the tag and __version__
# disagree.
#
# The release carries an installer, like RiftRec's: RiftLab's dependency stack
# (Qt, pyqtgraph, matplotlib, numpy) is the heavier of the two, so "just pip
# install it" is exactly the step that fails on somebody else's machine. Anyone
# who wants to CHANGE RiftLab works from a source checkout instead.
#
# A release also states which RiftRec schema version this build reads, so a
# recording and the tool that read it can be named together in a report.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write        # only the release step needs this

jobs:
  release:
    name: release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # needed to prove the tag sits on main

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip

      - name: Check the tag matches riftlab.__version__
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $m = Select-String -Path riftlab/__init__.py -Pattern '^__version__\s*=\s*"([^"]+)"'
          $v = $m.Matches[0].Groups[1].Value
          if ($tag -ne $v) {
            throw "Tag v$tag does not match __version__ $v. Bump riftlab/__init__.py in a pull request first, then tag the merge commit."
          }
          "version=$v" >> $env:GITHUB_OUTPUT

          $s = Select-String -Path riftlab/__init__.py -Pattern '^SUPPORTED_SCHEMA_VERSION\s*=\s*(\d+)'
          "schema=$($s.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: Check the tag is on main
        shell: pwsh
        run: |
          git fetch origin main --quiet
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "This tag is not an ancestor of origin/main - release only from main."
          }

      # pyinstaller belongs here too: this job runs the build-installer action,
      # which shells out to it. Leaving it out is what broke the v0.1.0 release
      # - the tests passed, then the freeze step could not find the command.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Run the test suite
        env:
          PYTHONPATH: .
        run: python -m pytest tests/ -q

      - uses: ./.github/actions/build-installer
        with:
          version: ${{ steps.version.outputs.version }}

      # Lets anyone check that the file they downloaded is the file that was
      # built here - which matters more than usual while the build is unsigned.
      - name: Checksum
        id: checksum
        shell: pwsh
        run: |
          $setup = "dist/RiftLab-Setup-${{ steps.version.outputs.version }}.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "$hash  $(Split-Path $setup -Leaf)" | Out-File "$setup.sha256" -Encoding ascii

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: RiftLab ${{ steps.version.outputs.version }}
          files: |
            dist/RiftLab-Setup-*.exe
            dist/RiftLab-Setup-*.exe.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Reads RiftRec recordings up to **schema v${{ steps.version.outputs.schema }}**.

            ## Install

            Download **RiftLab-Setup-${{ steps.version.outputs.version }}.exe** below and run it.
            No Python and no pip needed on the target PC.

            Windows shows **"Windows protected your PC"** because this build is not
            code-signed yet: **More info → Run anyway**. Some antivirus products sandbox
            an unknown installer first, so it can take a while to start or appear
            **twice** — clicking through both is harmless.

            `SHA256  ${{ steps.checksum.outputs.sha256 }}`

            ## Or from source, to change it

            ```
            pip install -r requirements.txt
            python -m riftlab gui
            ```

            ---
