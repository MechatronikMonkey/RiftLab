# Cut a RiftLab release.
#
# Trigger: a `v*` tag on main.
#
#     git switch main && git pull
#     git tag v0.2.0
#     git push origin v0.2.0
#
# The version is bumped beforehand, in riftlab/__init__.py, through a normal
# pull request. This workflow refuses to build if the tag and __version__
# disagree.
#
# Unlike RiftRec there is no installer to attach: RiftLab is run from a source
# checkout, by people who edit it. A release here marks a state - above all
# which RiftRec schema version it reads - so a recording and the tool that read
# it can be named together in a thesis or a report.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write        # only the release step needs this

jobs:
  release:
    name: release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # needed to prove the tag sits on main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"
          cache: pip

      - name: Check the tag matches riftlab.__version__
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $m = Select-String -Path riftlab/__init__.py -Pattern '^__version__\s*=\s*"([^"]+)"'
          $v = $m.Matches[0].Groups[1].Value
          if ($tag -ne $v) {
            throw "Tag v$tag does not match __version__ $v. Bump riftlab/__init__.py in a pull request first, then tag the merge commit."
          }
          "version=$v" >> $env:GITHUB_OUTPUT

          $s = Select-String -Path riftlab/__init__.py -Pattern '^SUPPORTED_SCHEMA_VERSION\s*=\s*(\d+)'
          "schema=$($s.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: Check the tag is on main
        shell: pwsh
        run: |
          git fetch origin main --quiet
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "This tag is not an ancestor of origin/main - release only from main."
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run the test suite
        env:
          PYTHONPATH: .
        run: python -m pytest tests/ -q

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: RiftLab ${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            Reads RiftRec recordings up to **schema v${{ steps.version.outputs.schema }}**.

            ## Run it

            ```
            pip install -r requirements.txt
            python -m riftlab gui
            ```

            Or double-click `Start RiftLab.bat`. RiftLab is run from a source
            checkout on purpose — it is meant to be read and extended, not just
            used.

            ---
